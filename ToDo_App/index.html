<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Todo Manager</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="todo-container">
        <!-- 1. Header -->
        <header class="app-header">
            <h1>📋 Daily Todo Manager</h1>
            <p class="date-display" id="date-display">2024년 1월 1일</p>
        </header>

        <!-- 4. Progress Area (Placed here for visual balance, or can be below inputs) -->
        <section class="progress-section">
            <div class="progress-info">
                <span id="progress-text">0/0 완료</span>
                <span id="progress-percentage">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </section>

        <!-- 2. Input Area -->
        <section class="input-area">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." autocomplete="off">
                <select id="category-select">
                    <option value="business">🏢 업무</option>
                    <option value="personal">🏠 개인</option>
                    <option value="study">📚 공부</option>
                </select>
            </div>
            <button id="add-btn"><i class="fas fa-plus"></i> 추가</button>
        </section>

        <!-- 3. Filter Buttons -->
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="business">업무</button>
            <button class="filter-btn" data-filter="personal">개인</button>
            <button class="filter-btn" data-filter="study">공부</button>
        </section>

        <!-- 5. Todo List -->
        <ul id="todo-list" class="todo-list">
            <!-- Items will be injected here via JS -->
            <li class="empty-message">
                할 일이 없습니다. 새로운 하루를 시작해보세요!
            </li>
        </ul>

        <!-- 6. Footer -->
        <footer class="app-footer">
            <button id="clear-completed-btn" class="text-btn">
                <i class="fas fa-check-double"></i> 완료된 항목 모두 삭제
            </button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
